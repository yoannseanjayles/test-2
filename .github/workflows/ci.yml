# CI (audit M-11) : build, typecheck et tests sur chaque push et PR.
# Le build précède le typecheck : `next build` génère next-env.d.ts
# (déclarations des imports d'images), absent d'un clone frais.
#
# Audit 2026-08 (MO-5) : ajout d'un audit de vulnérabilités et d'un scan de
# secrets. La CI ne conditionne pas le déploiement — Vercel déploie sur push
# indépendamment ; le gating se règle côté Vercel (« Only deploy when checks
# pass »), pas dans ce fichier.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  securite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique complet : le scan de secrets doit voir tous les commits.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Seules les dépendances de production bloquent : les vulnérabilités de
      # storybook et drizzle-kit ne sont jamais expédiées aux visiteurs.
      - name: Audit des dépendances de production
        run: pnpm audit --prod --audit-level high

      # Rapport complet en information, sans faire échouer la CI.
      - name: Audit complet (informatif)
        run: pnpm audit || true

      # Scan de secrets sans action tierce : mêmes motifs que l'audit 2026-08.
      # Deux contraintes sur les motifs : pas d'apostrophe ni de guillemet
      # (citabilité YAML), et une longueur de suffixe realiste — sinon le
      # simple prefixe `sk_live_` cite dans .env.example ou dans le rapport
      # d'audit declenche une fausse alerte a chaque execution.
      - name: Scan de secrets dans l'historique
        run: |
          set -e
          MOTIFS='sk_(live|test)_[A-Za-z0-9]{20,}|whsec_[A-Za-z0-9]{24,}|re_[A-Za-z0-9]{24,}|postgres(ql)?://[^:[:space:]]+:[^@[:space:]]+@|AIza[0-9A-Za-z_-]{30,}|gh[pousr]_[A-Za-z0-9]{30,}'
          if git grep -nIE "$MOTIFS" $(git rev-list --all) -- 2>/dev/null | head -20 | grep .; then
            echo "::error::Secret potentiel detecte dans l historique Git - revoquer et purger."
            exit 1
          fi
          echo "Aucun secret detecte dans l historique."

      # Un .env commité est une fuite, même vide.
      - name: Aucun fichier .env versionné
        run: |
          set -e
          if git log --all --diff-filter=A --name-only --pretty=format: \
             | sort -u | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example'; then
            echo "::error::Un fichier .env a été commité — révoquer les identifiants concernés."
            exit 1
          fi
          echo "Aucun .env versionné."
